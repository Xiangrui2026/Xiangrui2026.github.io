baseURL: "https://xiangrui2026.github.io/"
languageCode: zh-cn
defaultContentLanguage: zh-cn
title: Joesph
theme: hugo-theme-next
hasCJKLanguage: true
timeZone: Asia/Shanghai
enableRobotsTXT: true
summaryLength: 80
mainSections:
  - posts

outputFormats:
  LocalIndexes:
    mediaType: application/xml
    baseName: searchindexes
    isPlainText: true
    notAlternative: true

outputs:
  home:
    - HTML
    - RSS
    - LocalIndexes

caches:
  images:
    dir: :cacheDir/images

menus:
  main:
    - identifier: posts
      name: 文章
      pageRef: /posts
      pre: file-text
      weight: 1
    - identifier: archives
      name: 归档
      pageRef: /archives
      pre: archive
      weight: 2
    - identifier: showcase
      name: 展示
      pageRef: /showcase
      pre: picture-o
      weight: 3
    - identifier: about
      name: 关于我
      pageRef: /about
      pre: user
      weight: 4
    - identifier: search
      name: 搜索
      pageRef: /search
      pre: search
      weight: 5

params:
  author: Joesph
  description: Joesph 的个人网站
  subtitle: 记录、整理与展示
  mainSections:
    - posts
  yearFormat: "2006"
  monthFormat: "2006-01"
  dateFormat: "2006-01-02"
  timeFormat: "2006-01-02 15:04:05 -07:00"
  scheme: Gemini
  darkmode: true
  bodyScrollbar:
    overlay: false
    stable: true
  mobileLayoutEconomy: true
  themeColor:
    dark: "#222"
    light: "#222"
  bookmark:
    color: "#222"
    enable: true
  githubBanner:
    enable: true
  menuSets:
    icons: true
    transition: true
    badges: false
  footer:
    icon:
      color: "#ff0000"
      animated: true
    beian:
      enable: false
  font:
    enable: true
  codeblock:
    copyBtn: true
    style: mac
    maxHeight: 200
  sidebar:
    offset: 12
    padding: 18
    position: left
    width: 256
  motion:
    enable: false
    transition:
      sidebar: false
      collHeader: false
      postBlock: false
      postBody: false
      postHeader: false
  backTop:
    enable: true
    scrollpercent: true
    sidebar: false
  avatar:
    rotated: true
    rounded: true
  siteState:
    basic: true
  socialIcons:
    iconsOnly: false
    transition: true
  linksSets:
    layout: inline
  toc:
    enable: true
    number: true
    expandAll: false
    wrap: false
  creativeCommons:
    post: false
  postEdit:
    enable: false
  postMeta:
    itemText: false
  rewardSets:
    animation: false
  postFooter:
    tagIcon: false
  share:
    enable: false
  textAlign:
    desktop: left
    mobile: left
  note:
    icons: true
    lightBgOffset: 0
    style: simple
  tabs:
    transition:
      labels: true
      tabs: false
  readingProgress:
    start: left
    color: "#37c6c0"
    enable: true
    height: 3px
    position: top
    reversed: false
  pdf:
    enable: false
    height: 500px
  algoliaSearch:
    enable: false
  localSearch:
    enable: false
    path: /searchindexes.xml
    preload: false
    topnperarticle: 1
  gitter:
    enable: false
  comments:
    storage: false
    nav: []

markup:
  goldmark:
    renderer:
      unsafe: false
